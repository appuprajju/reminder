<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>reminderme Smooth 30fps Intro Renderer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1280px; height: 720px; overflow: hidden; background: #050712; }
    canvas { display: block; width: 1280px; height: 720px; }
  </style>
</head>
<body>
  <canvas id="intro-canvas" width="1280" height="720"></canvas>
  <script>
    const W = 1280;
    const H = 720;
    const FPS = 30;
    const DURATION = 63.0;
    const TOTAL_FRAMES = Math.round(DURATION * FPS);
    const canvas = document.getElementById('intro-canvas');
    const ctx = canvas.getContext('2d');

    const FONT_DISPLAY = '"Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", sans-serif';
    const FONT_SANS = '"DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", sans-serif';
    const FONT_MONO = '"JetBrains Mono", ui-monospace, SFMono-Regular, monospace';

    const CHAPTERS = [
      { id: 0, start: 0.0,  end: 6.5,  tag: 'CHAPTER 01', label: 'Meet reminderme' },
      { id: 1, start: 6.5,  end: 14.5, tag: 'CHAPTER 02 · NEW', label: 'India All-State Languages' },
      { id: 2, start: 14.5, end: 21.5, tag: 'CHAPTER 03', label: 'Voice Note Maker' },
      { id: 3, start: 21.5, end: 29.0, tag: 'CHAPTER 04', label: 'OS-Aware Voice Assistants' },
      { id: 4, start: 29.0, end: 36.0, tag: 'CHAPTER 05', label: 'Custom MP3 & EMO Island' },
      { id: 5, start: 36.0, end: 43.5, tag: 'CHAPTER 06', label: 'Lock-Screen & Home Widget' },
      { id: 6, start: 43.5, end: 50.5, tag: 'CHAPTER 07', label: 'Schedule, Insights & Focus' },
      { id: 7, start: 50.5, end: 57.0, tag: 'CHAPTER 08', label: 'Google Sync & Flexible Sign-In' },
      { id: 8, start: 57.0, end: 63.0, tag: 'CHAPTER 09', label: 'Start Organizing Today' },
    ];

    const clamp = (v, lo = 0, hi = 1) => Math.max(lo, Math.min(hi, v));
    const easeOut = (t) => 1 - Math.pow(1 - clamp(t), 3);
    const easeInOut = (t) => {
      const x = clamp(t);
      return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
    };
    const easeBack = (t) => {
      const c1 = 1.70158, c3 = c1 + 1;
      const x = clamp(t);
      return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
    };

    function roundRect(x, y, w, h, r) {
      const rad = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + rad, y);
      ctx.arcTo(x + w, y, x + w, y + h, rad);
      ctx.arcTo(x + w, y + h, x, y + h, rad);
      ctx.arcTo(x, y + h, x, y, rad);
      ctx.arcTo(x, y, x + w, y, rad);
      ctx.closePath();
    }

    function drawWrappedText(text, x, y, maxWidth, lineHeight, maxLines = 4) {
      const words = text.split(' ');
      let line = '';
      let cy = y;
      let lines = 0;
      for (const word of words) {
        const test = line ? `${line} ${word}` : word;
        if (ctx.measureText(test).width > maxWidth && line) {
          ctx.fillText(line, x, cy);
          line = word;
          cy += lineHeight;
          lines += 1;
          if (lines >= maxLines - 1) break;
        } else {
          line = test;
        }
      }
      if (line) ctx.fillText(line, x, cy);
    }

    function drawGlassCard(x, y, w, h, r = 24, borderAlpha = 0.22, tint = null) {
      ctx.save();
      roundRect(x, y + 7, w, h, r);
      ctx.fillStyle = 'rgba(0, 0, 0, 0.32)';
      ctx.fill();

      roundRect(x, y, w, h, r);
      const grad = ctx.createLinearGradient(x, y, x + w, y + h);
      if (tint) {
        grad.addColorStop(0, tint[0]);
        grad.addColorStop(1, tint[1]);
      } else {
        grad.addColorStop(0, 'rgba(24, 33, 62, 0.86)');
        grad.addColorStop(1, 'rgba(11, 16, 36, 0.92)');
      }
      ctx.fillStyle = grad;
      ctx.fill();

      ctx.strokeStyle = `rgba(255, 255, 255, ${borderAlpha})`;
      ctx.lineWidth = 1.25;
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(x + r, y + 1);
      ctx.lineTo(x + w - r, y + 1);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.34)';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.restore();
    }

    function drawPill(x, y, text, bg, border, color, fontSize = 13, padX = 12) {
      ctx.save();
      ctx.font = `700 ${fontSize}px ${FONT_SANS}`;
      const tw = ctx.measureText(text).width;
      const pw = tw + padX * 2;
      const ph = fontSize + 14;
      roundRect(x, y, pw, ph, ph / 2);
      ctx.fillStyle = bg;
      ctx.fill();
      ctx.strokeStyle = border;
      ctx.lineWidth = 1.2;
      ctx.stroke();
      ctx.fillStyle = color;
      ctx.textBaseline = 'middle';
      ctx.fillText(text, x + padX, y + ph / 2 + 0.5);
      ctx.restore();
      return pw;
    }

    function makeGlowSprite(color) {
      const c = document.createElement('canvas');
      c.width = 256;
      c.height = 256;
      const gctx = c.getContext('2d');
      const rg = gctx.createRadialGradient(128, 128, 4, 128, 128, 128);
      rg.addColorStop(0, color);
      rg.addColorStop(1, 'rgba(5, 7, 18, 0)');
      gctx.fillStyle = rg;
      gctx.fillRect(0, 0, 256, 256);
      return c;
    }

    function makeOrbSprite(c1, c2) {
      const c = document.createElement('canvas');
      c.width = 180;
      c.height = 180;
      const octx = c.getContext('2d');
      const og = octx.createRadialGradient(64, 64, 8, 90, 90, 86);
      og.addColorStop(0, 'rgba(255,255,255,0.72)');
      og.addColorStop(0.28, c1);
      og.addColorStop(1, c2);
      octx.fillStyle = og;
      octx.beginPath();
      octx.arc(90, 90, 86, 0, Math.PI * 2);
      octx.fill();
      return c;
    }

    const GLOW_SPRITES = [
      makeGlowSprite('rgba(56, 35, 146, 0.45)'),
      makeGlowSprite('rgba(14, 116, 180, 0.40)'),
      makeGlowSprite('rgba(130, 32, 108, 0.32)'),
    ];
    const ORB_SPRITES = [
      makeOrbSprite('#38BDF8', '#1D4ED8'),
      makeOrbSprite('#A855F7', '#4C1D95'),
      makeOrbSprite('#30D158', '#065F46'),
    ];

    function drawBackground(t) {
      ctx.fillStyle = '#050712';
      ctx.fillRect(0, 0, W, H);

      const glows = [
        { x: 200 + Math.sin(t * 0.45) * 85, y: 120 + Math.cos(t * 0.38) * 50, r: 440, s: GLOW_SPRITES[0] },
        { x: 1080 + Math.cos(t * 0.40) * 80, y: 160 + Math.sin(t * 0.35) * 65, r: 420, s: GLOW_SPRITES[1] },
        { x: 640 + Math.sin(t * 0.32) * 110, y: 660 + Math.cos(t * 0.28) * 45, r: 460, s: GLOW_SPRITES[2] },
      ];
      for (const g of glows) {
        ctx.drawImage(g.s, g.x - g.r, g.y - g.r, g.r * 2, g.r * 2);
      }

      const orbs = [
        { x: 145 + Math.sin(t * 0.75) * 28, y: 540 + Math.cos(t * 0.65) * 22, r: 72, s: ORB_SPRITES[0] },
        { x: 1150 + Math.cos(t * 0.68) * 26, y: 510 + Math.sin(t * 0.58) * 24, r: 86, s: ORB_SPRITES[1] },
        { x: 980 + Math.sin(t * 0.55) * 20, y: 110 + Math.cos(t * 0.62) * 18, r: 46, s: ORB_SPRITES[2] },
      ];
      ctx.save();
      ctx.globalAlpha = 0.54;
      for (const o of orbs) {
        ctx.drawImage(o.s, o.x - o.r, o.y - o.r, o.r * 2, o.r * 2);
      }
      ctx.restore();

      ctx.save();
      for (let i = 0; i < 40; i++) {
        const px = ((i * 197.3 + t * 5) % W);
        const py = ((i * 113.7 + t * (9 + (i % 5) * 3)) % H);
        const a = 0.12 + 0.18 * Math.sin(t * 2.0 + i);
        ctx.fillStyle = `rgba(186, 230, 253, ${a})`;
        ctx.beginPath();
        ctx.arc(px, py, (i % 3 === 0 ? 1.8 : 1.1), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function drawEmoDynamicIsland(cx, y, title, subtitle, accent = '#38BDF8', mood = 'happy', t = 0) {
      const iw = 410;
      const ih = 58;
      const ix = cx - iw / 2;
      ctx.save();
      roundRect(ix - 3, y + 5, iw + 6, ih + 4, 31);
      ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
      ctx.fill();

      roundRect(ix, y, iw, ih, 29);
      ctx.fillStyle = '#03050C';
      ctx.fill();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.24)';
      ctx.lineWidth = 1.2;
      ctx.stroke();

      const eyeY = y + ih / 2;
      const blinkCycle = (t * 0.42) % 1;
      const blink = blinkCycle > 0.94 ? 0.16 : 1;
      const bounce = mood === 'excited' ? Math.sin(t * 7.5) * 2.4 : Math.sin(t * 3.0) * 1.0;
      const lookX = Math.sin(t * 1.4) * 1.8;
      ctx.fillStyle = accent;
      roundRect(ix + 24 + lookX, eyeY - 9 * blink + bounce, 14, 18 * blink, 6);
      ctx.fill();
      roundRect(ix + 44 + lookX, eyeY - 9 * blink + bounce, 14, 18 * blink, 6);
      ctx.fill();

      ctx.textAlign = 'left';
      ctx.fillStyle = '#FFFFFF';
      ctx.font = `700 13.5px ${FONT_SANS}`;
      ctx.textBaseline = 'top';
      ctx.fillText(title, ix + 74, y + 13);
      ctx.fillStyle = '#94A3B8';
      ctx.font = `500 12px ${FONT_SANS}`;
      ctx.fillText(subtitle, ix + 74, y + 32);
      ctx.restore();
    }

    function drawBellIcon(cx, cy, size, glow = '#0A84FF') {
      ctx.save();
      const halo = ctx.createRadialGradient(cx, cy, size * 0.2, cx, cy, size * 0.85);
      halo.addColorStop(0, 'rgba(10, 132, 255, 0.42)');
      halo.addColorStop(1, 'rgba(10, 132, 255, 0)');
      ctx.fillStyle = halo;
      ctx.beginPath();
      ctx.arc(cx, cy, size * 0.85, 0, Math.PI * 2);
      ctx.fill();

      roundRect(cx - size / 2, cy - size / 2, size, size, size * 0.28);
      const bg = ctx.createLinearGradient(cx - size / 2, cy - size / 2, cx + size / 2, cy + size / 2);
      bg.addColorStop(0, '#4BA3FF');
      bg.addColorStop(1, '#0A64E8');
      ctx.fillStyle = bg;
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.4)';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.arc(cx, cy - size * 0.08, size * 0.21, Math.PI, 0);
      ctx.lineTo(cx + size * 0.25, cy + size * 0.17);
      ctx.lineTo(cx - size * 0.25, cy + size * 0.17);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.arc(cx, cy + size * 0.24, size * 0.075, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawHeaderAndProgress(ch, t) {
      drawBellIcon(56, 44, 34);
      ctx.save();
      ctx.textAlign = 'left';
      ctx.fillStyle = '#FFFFFF';
      ctx.font = `700 19px ${FONT_DISPLAY}`;
      ctx.textBaseline = 'middle';
      ctx.fillText('reminderme', 84, 44);

      const badgeText = `${ch.tag}  ·  ${ch.label}`;
      ctx.font = `700 12px ${FONT_SANS}`;
      const bw = ctx.measureText(badgeText).width + 24;
      drawPill(W - bw - 36, 30, badgeText, 'rgba(14,165,233,0.18)', 'rgba(56,189,248,0.45)', '#BAE6FD', 12, 12);

      const barY = H - 24;
      const barX = 44;
      const barW = W - 88;
      roundRect(barX, barY, barW, 5, 3);
      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      ctx.fill();
      const prog = clamp(t / DURATION);
      roundRect(barX, barY, Math.max(8, barW * prog), 5, 3);
      const pg = ctx.createLinearGradient(barX, 0, barX + barW, 0);
      pg.addColorStop(0, '#38BDF8');
      pg.addColorStop(0.5, '#0A84FF');
      pg.addColorStop(1, '#30D158');
      ctx.fillStyle = pg;
      ctx.fill();
      ctx.restore();
    }

    function chapterAlpha(lt, dur) {
      const fadeIn = easeOut(lt / 0.42);
      const fadeOut = easeOut((dur - lt) / 0.35);
      return Math.min(fadeIn, fadeOut);
    }

    function drawCh1(lt, t, dur) {
      const a = chapterAlpha(lt, dur);
      const pop = easeBack(lt / 0.85);
      const floatY = Math.sin(t * 2.2) * 4;
      ctx.save();
      ctx.globalAlpha = a;

      drawEmoDynamicIsland(W / 2, 74 - (1 - easeOut(lt / 0.6)) * 22, 'reminderme Ready', 'All-India Languages · Voice Notes · Exact Alarms', '#38BDF8', 'excited', t);
      drawBellIcon(W / 2, 230 + floatY, 92 * pop);

      ctx.textAlign = 'center';
      ctx.fillStyle = '#FFFFFF';
      ctx.font = `800 54px ${FONT_DISPLAY}`;
      ctx.fillText('reminderme', W / 2, 336);

      ctx.fillStyle = '#BAE6FD';
      ctx.font = `600 22px ${FONT_SANS}`;
      ctx.fillText('Smart Alarms, Voice Notes & All-India Multi-Language Planner', W / 2, 378);

      const features = [
        { k: '28 Languages', v: 'All 28 States & 8 UTs', c: '#38BDF8' },
        { k: 'Voice Note Maker', v: 'Multi-language dictation', c: '#A855F7' },
        { k: 'OS Voice AI', v: 'Siri · Google · Desktop', c: '#30D158' },
        { k: 'Lock-Screen', v: 'Swipe-up & Home Widget', c: '#FF9F0A' },
      ];
      const cardW = 258, gap = 22, startX = (W - (cardW * 4 + gap * 3)) / 2;
      features.forEach((f, idx) => {
        const fp = easeOut((lt - 0.35 - idx * 0.16) / 0.55);
        const cx = startX + idx * (cardW + gap);
        const cy = 432 + (1 - fp) * 26 + Math.sin(t * 2 + idx) * 2.5;
        ctx.save();
        ctx.globalAlpha = a * fp;
        drawGlassCard(cx, cy, cardW, 114, 20, 0.24);
        ctx.fillStyle = f.c;
        ctx.beginPath();
        ctx.arc(cx + 28, cy + 38, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.textAlign = 'left';
        ctx.fillStyle = '#FFFFFF';
        ctx.font = `700 18px ${FONT_DISPLAY}`;
        ctx.fillText(f.k, cx + 44, cy + 44);
        ctx.fillStyle = '#CBD5E1';
        ctx.font = `500 14px ${FONT_SANS}`;
        ctx.fillText(f.v, cx + 22, cy + 82);
        ctx.restore();
      });

      ctx.textAlign = 'center';
      ctx.fillStyle = '#94A3B8';
      ctx.font = `600 14px ${FONT_MONO}`;
      ctx.fillText('DEVELOPED BY  PRAJWAL M </yourstudio>', W / 2, 610);
      ctx.restore();
    }

    function drawCh2(lt, t, dur) {
      const a = chapterAlpha(lt, dur);
      ctx.save();
      ctx.globalAlpha = a;

      const locales = [
        { state: 'Karnataka', native: 'ಕನ್ನಡ', eng: 'Kannada', code: 'KN', greeting: 'ಶುಭ ಸಂಜೆ', newAlarm: '+ ಹೊಸ ಅಲಾರಾಂ', notes: 'ಧ್ವನಿ ಟಿಪ್ಪಣಿಗಳು', nav: ['ಇಂದು', 'ವೇಳಾಪಟ್ಟಿ', 'ವಿಶ್ಲೇಷಣೆ', 'ಪ್ರೊಫೈಲ್'] },
        { state: 'Delhi / UP', native: 'हिन्दी', eng: 'Hindi', code: 'HI', greeting: 'शुभ संध्या', newAlarm: '+ नया अलार्म', notes: 'वॉइस नोट्स', nav: ['आज', 'शेड्यूल', 'इनसाइट्स', 'प्रोफ़ाइल'] },
        { state: 'Tamil Nadu', native: 'தமிழ்', eng: 'Tamil', code: 'TA', greeting: 'மாலை வணக்கம்', newAlarm: '+ புதிய அலாரம்', notes: 'குரல் குறிப்புகள்', nav: ['இன்று', 'அட்டவணை', 'புள்ளிவிவரம்', 'சுயவிவரம்'] },
        { state: 'Maharashtra', native: 'मराठी', eng: 'Marathi', code: 'MR', greeting: 'शुभ संध्याकाळ', newAlarm: '+ नवीन अलार्म', notes: 'व्हॉइस नोट्स', nav: ['आज', 'वेळापत्रक', 'विश्लेषण', 'प्रोफाइल'] },
      ];
      const slot = 1.95;
      const activeIdx = Math.min(locales.length - 1, Math.floor(lt / slot));
      const slotT = lt - activeIdx * slot;
      const cur = locales[activeIdx];
      const morphP = easeOut(slotT / 0.32);

      drawEmoDynamicIsland(W / 2, 74, cur.native, `Language switched to ${cur.eng} (${cur.state})`, '#30D158', 'happy', t);

      ctx.textAlign = 'left';
      ctx.fillStyle = '#FFFFFF';
      ctx.font = `800 38px ${FONT_DISPLAY}`;
      ctx.fillText('Every State. Every Language.', 56, 174);
      ctx.fillStyle = '#94A3B8';
      ctx.font = `500 17px ${FONT_SANS}`;
      ctx.fillText('All 28 Indian States & 8 Union Territories — 22 Eighth Schedule + Regional Languages', 56, 206);

      drawGlassCard(56, 232, 620, 426, 24, 0.26);
      ctx.fillStyle = '#FFFFFF';
      ctx.font = `700 18px ${FONT_DISPLAY}`;
      ctx.fillText('India State & Regional Languages', 84, 268);
      drawPill(434, 248, 'By State / UT (36)', 'rgba(10,132,255,0.28)', 'rgba(56,189,248,0.65)', '#E0F2FE', 12, 12);

      roundRect(84, 290, 564, 42, 12);
      ctx.fillStyle = 'rgba(255,255,255,0.06)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(56,189,248,0.35)';
      ctx.stroke();
      const typedLen = Math.ceil(clamp(slotT / 0.45) * cur.state.length);
      ctx.fillStyle = '#CBD5E1';
      ctx.font = `500 14px ${FONT_SANS}`;
      ctx.fillText(`Search state or script…  "${cur.state.slice(0, typedLen)}"`, 104, 316);

      const stateCards = [
        { s: 'Karnataka', chips: ['ಕನ್ನಡ · Kannada', 'कोंकणी'], active: activeIdx === 0 },
        { s: 'Delhi · UP · Bihar', chips: ['हिन्दी · Hindi', 'मैथिली'], active: activeIdx === 1 },
        { s: 'Tamil Nadu · Puducherry', chips: ['தமிழ் · Tamil', 'English (IN)'], active: activeIdx === 2 },
        { s: 'Maharashtra · Goa', chips: ['मराठी · Marathi', 'कोंकणी'], active: activeIdx === 3 },
        { s: 'AP · Telangana · Kerala', chips: ['తెలుగు · Telugu', 'മലയാളം'], active: false },
        { s: 'WB · Gujarat · Punjab · NE', chips: ['বাংলা', 'ગુજરાતી', 'ਪੰਜਾਬੀ', 'অসমীয়া'], active: false },
      ];
      stateCards.forEach((sc, idx) => {
        const col = idx % 2;
        const row = Math.floor(idx / 2);
        const sx = 84 + col * 288;
        const sy = 348 + row * 98;
        roundRect(sx, sy, 274, 86, 16);
        ctx.fillStyle = sc.active ? 'rgba(10,132,255,0.22)' : 'rgba(255,255,255,0.045)';
        ctx.fill();
        ctx.strokeStyle = sc.active ? 'rgba(56,189,248,0.85)' : 'rgba(255,255,255,0.12)';
        ctx.lineWidth = sc.active ? 1.8 : 1;
        ctx.stroke();

        ctx.fillStyle = '#FFFFFF';
        ctx.font = `700 13.5px ${FONT_SANS}`;
        ctx.fillText(sc.s, sx + 14, sy + 24);

        let cx = sx + 14;
        sc.chips.forEach((chLabel, ci) => {
          const isHl = sc.active && ci === 0;
          const pw = drawPill(
            cx,
            sy + 42,
            chLabel,
            isHl ? '#0A84FF' : 'rgba(255,255,255,0.08)',
            isHl ? '#7DD3FC' : 'rgba(255,255,255,0.16)',
            '#FFFFFF',
            11.5,
            9
          );
          cx += pw + 6;
        });
      });

      // Right Card: Live Localized App Preview with smooth slide/fade morph
      drawGlassCard(704, 232, 520, 426, 24, 0.28, ['rgba(18, 28, 56, 0.92)', 'rgba(9, 14, 32, 0.96)']);

      ctx.save();
      ctx.globalAlpha = a * (0.35 + 0.65 * morphP);
      roundRect(720, 248, 152, 394, 16);
      ctx.fillStyle = 'rgba(255,255,255,0.05)';
      ctx.fill();
      roundRect(732, 264, 128, 36, 12);
      ctx.fillStyle = '#0A84FF';
      ctx.fill();
      ctx.fillStyle = '#FFFFFF';
      ctx.font = `700 13px ${FONT_SANS}`;
      ctx.textAlign = 'center';
      ctx.fillText(cur.newAlarm, 796, 287);

      ctx.textAlign = 'left';
      cur.nav.forEach((nLabel, ni) => {
        const ny = 324 + ni * 40;
        if (ni === 0) {
          roundRect(732, ny - 16, 128, 32, 10);
          ctx.fillStyle = 'rgba(255,255,255,0.12)';
          ctx.fill();
        }
        ctx.fillStyle = ni === 0 ? '#FFFFFF' : '#94A3B8';
        ctx.font = `600 13.5px ${FONT_SANS}`;
        ctx.fillText(nLabel, 746, ny + 4);
      });

      roundRect(732, 502, 128, 38, 12);
      ctx.fillStyle = 'rgba(14,165,233,0.20)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(56,189,248,0.6)';
      ctx.stroke();
      ctx.fillStyle = '#FFFFFF';
      ctx.font = `700 13px ${FONT_SANS}`;
      ctx.fillText(cur.native, 746, 525);
      ctx.fillStyle = '#7DD3FC';
      ctx.font = `700 11px ${FONT_MONO}`;
      ctx.fillText(cur.code, 830, 525);

      const sec = String(Math.floor(t) % 60).padStart(2, '0');
      ctx.fillStyle = '#94A3B8';

        ctx.globalAlpha = a * ip;
        drawGlassCard(140, iy, 1000, 114, 22, 0.26);
        ctx.fillStyle = it.c;
        roundRect(166, iy + 28, 6, 58, 3);
        ctx.fill();
        ctx.textAlign = 'left';
        ctx.fillStyle = '#FFFFFF';
        ctx.font = `700 22px ${FONT_DISPLAY}`;
        ctx.fillText(it.t, 194, iy + 48);
        ctx.fillStyle = '#CBD5E1';
        ctx.font = `500 15.5px ${FONT_SANS}`;
        ctx.fillText(it.d, 194, iy + 82);
        ctx.restore();
      });
      ctx.restore();
    }

    function drawCh9(lt, t, dur) {
      const a = easeOut(lt / 0.55) * easeOut((dur - lt) / 0.5);
      ctx.save();
      ctx.globalAlpha = a;

      drawBellIcon(W / 2, 206 + Math.sin(t * 2.2) * 3, 98 * easeBack(lt / 0.85));

      ctx.textAlign = 'center';
      ctx.fillStyle = '#FFFFFF';
      ctx.font = `800 54px ${FONT_DISPLAY}`;
      ctx.fillText('reminderme', W / 2, 314);
      ctx.fillStyle = '#BAE6FD';
      ctx.font = `600 22px ${FONT_SANS}`;
      ctx.fillText('Smart Daily Planner for Every Language & Every Device', W / 2, 356);

      const badges = [
        '28 Indian States & 8 UTs',
        '28 Languages',
        'Voice Note Maker',
        'Hey Siri · Hey Google · Hands-Free',
        'Custom MP3 Ringtones',
        'Lock-Screen Gestures & Widget',
      ];
      let bx = 136, by = 406;
      ctx.textAlign = 'left';
      badges.forEach((b) => {
        ctx.font = `700 14px ${FONT_SANS}`;
        const estW = ctx.measureText(b).width + 24;
        if (bx + estW > W - 136) {
          bx = 220;
          by += 48;
        }
        const pw = drawPill(bx, by, b, 'rgba(14,165,233,0.18)', 'rgba(56,189,248,0.48)', '#E0F2FE', 14, 12);
        bx += pw + 14;
      });

      ctx.textAlign = 'center';
      ctx.fillStyle = '#FFFFFF';
      ctx.font = `700 18px ${FONT_DISPLAY}`;
      ctx.fillText('Developed by Prajwal M', W / 2, 566);
      ctx.fillStyle = '#38BDF8';
      ctx.font = `700 16px ${FONT_MONO}`;
      ctx.fillText('</yourstudio>', W / 2, 594);
      ctx.restore();
    }

    function renderFrame(timeSec) {
      const t = clamp(timeSec, 0, DURATION);
      drawBackground(t);
      let ch = CHAPTERS[CHAPTERS.length - 1];
      for (const c of CHAPTERS) {
        if (t >= c.start && t < c.end) { ch = c; break; }
      }
      const lt = t - ch.start;
      const dur = ch.end - ch.start;

      switch (ch.id) {
        case 0: drawCh1(lt, t, dur); break;
        case 1: drawCh2(lt, t, dur); break;
        case 2: drawCh3(lt, t, dur); break;
        case 3: drawCh4(lt, t, dur); break;
        case 4: drawCh5(lt, t, dur); break;
        case 5: drawCh6(lt, t, dur); break;
        case 6: drawCh7(lt, t, dur); break;
        case 7: drawCh8(lt, t, dur); break;
        case 8: drawCh9(lt, t, dur); break;
      }

      drawHeaderAndProgress(ch, t);
    }

    function canvasToJpegBlob() {
      return new Promise((resolve, reject) => {
        canvas.toBlob((blob) => {
          if (blob) resolve(blob);
          else reject(new Error('canvas.toBlob returned null'));
        }, 'image/jpeg', 0.88);
      });
    }

    let started = false;
    window.__renderAndPipeAllFrames = async () => {
      if (started) return TOTAL_FRAMES;
      started = true;
      try {
        await document.fonts.ready;
        const BATCH = 15;
        let batch = [];
        for (let f = 0; f < TOTAL_FRAMES; f++) {
          renderFrame(f / FPS);
          const blob = await canvasToJpegBlob();
          batch.push(blob);
          if (batch.length === BATCH || f === TOTAL_FRAMES - 1) {
            const count = batch.length;
            const body = new Blob(batch);
            batch = [];
            const res = await fetch('/frames?count=' + count, { method: 'POST', body });
            if (!res.ok) throw new Error('Failed piping frame ' + f);
          }
        }
        const doneRes = await fetch('/done', { method: 'POST' });
        if (!doneRes.ok) throw new Error('FFmpeg finalize failed');
        return TOTAL_FRAMES;
      } catch (err) {
        await fetch('/error', { method: 'POST', body: String(err && err.stack ? err.stack : err) }).catch(() => {});
        throw err;
      }
    };

    renderFrame(0);
    window.__introCanvasReady = true;
    if (location.search.includes('autostart=1')) {
      setTimeout(() => { window.__renderAndPipeAllFrames(); }, 100);
    }
  </script>
</body>
