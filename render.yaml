services:
  - type: web
    name: glassy-daily
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: VAPID_SUBJECT
        value: mailto:you@example.com
    disk:
      name: glassy-data
      mountPath: /var/data
      sizeGB: 1
