name = "reminder-worker"
main = "src/index.ts"
compatibility_date = "2024-04-05"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "reminder-db"
database_id = "5ce8f4ff-d94b-449a-bc45-12ec01f5274b" # Replace with your own D1 database_id from `wrangler d1 create reminder-db`

[vars]
VAPID_SUBJECT = "mailto:admin@reminderme.app"
APP_URL = "https://reminder.makeuperfect.in"
ADMIN_EMAILS = ""
ALLOWED_ORIGINS = ""
# Set sensitive keys securely with wrangler secret put:
#   npx wrangler secret put VAPID_PUBLIC_KEY
#   npx wrangler secret put VAPID_PRIVATE_KEY
#   npx wrangler secret put CRON_SECRET
