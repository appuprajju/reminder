<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glassy Daily — Reminders</title>
<meta name="description" content="3D glass daily reminders with real phone notifications.">
<meta name="theme-color" content="#070816">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Glassy Daily">
<style>
:root{
  --glass: rgba(255,255,255,.12);
  --glass-strong: rgba(255,255,255,.2);
  --stroke: rgba(255,255,255,.28);
  --muted: rgba(255,255,255,.62);
  --green: #30d158;
  --red: #ff453a;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Segoe UI", Roboto, sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:var(--font);color:#fff;background:#05060f;overflow-x:hidden;min-height:100vh;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}

#scene{position:fixed;inset:0;perspective:1200px;overflow:hidden;z-index:0;
  background:
   radial-gradient(1200px 800px at 15% 10%, #2b1b6b 0%, transparent 60%),
   radial-gradient(1000px 800px at 90% 20%, #0b4a7a 0%, transparent 60%),
   radial-gradient(1100px 900px at 50% 110%, #7a1d5e 0%, transparent 60%),
   #070816;}
.sphere{position:absolute;border-radius:50%;transform-style:preserve-3d;
  background:
    radial-gradient(circle at 30% 25%, rgba(255,255,255,.85) 0 4%, rgba(255,255,255,.15) 14%, transparent 34%),
    radial-gradient(circle at 70% 80%, rgba(255,255,255,.25), transparent 45%),
    radial-gradient(circle at 50% 50%, var(--c1), var(--c2) 75%);
  box-shadow: inset -12px -18px 40px rgba(0,0,0,.35), inset 8px 10px 30px rgba(255,255,255,.25), 0 30px 80px var(--c2);
  opacity:.9;animation:float var(--d,12s) ease-in-out infinite alternate;will-change:transform}
@keyframes float{from{margin-top:-18px}to{margin-top:22px}}

.app{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:max(28px,env(safe-area-inset-top)) 22px 120px;
  display:grid;grid-template-columns:1.05fr 1fr;gap:26px;perspective:1600px}
@media(max-width:860px){.app{grid-template-columns:1fr}}
header.top{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:22px;letter-spacing:-.02em}
.logo{width:42px;height:42px;border-radius:12px;display:block;box-shadow:0 8px 24px rgba(10,132,255,.5)}
.actions{display:flex;gap:10px;flex-wrap:wrap}

.glass{background:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,.06));border:1px solid var(--stroke);
  backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);
  box-shadow:0 20px 60px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.45), inset 0 -1px 0 rgba(255,255,255,.08);border-radius:28px}
.btn{font:inherit;color:#fff;border:1px solid var(--stroke);background:var(--glass);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:10px 16px;border-radius:999px;cursor:pointer;font-weight:600;font-size:14px;
  transition:transform .2s, background .2s;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.btn:hover{background:var(--glass-strong);transform:translateY(-1px)}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.6;cursor:default}
.btn.primary{background:linear-gradient(180deg,#3da0ff,#0a84ff);border-color:rgba(255,255,255,.4);box-shadow:0 8px 24px rgba(10,132,255,.45), inset 0 1px 0 rgba(255,255,255,.5)}
.btn.on{background:rgba(48,209,88,.35);border-color:rgba(48,209,88,.7)}
.btn.warn{background:rgba(255,159,10,.3);border-color:rgba(255,159,10,.7)}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:linear-gradient(145deg,#bf5af2,#5e5ce6);border:1px solid var(--stroke);cursor:pointer;color:#fff;font:inherit;font-weight:700}

[data-tilt]{transform-style:preserve-3d;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .25s ease-out;position:relative}
[data-tilt].active{transition:transform .06s linear}
[data-tilt]::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(420px circle at var(--gx,50%) var(--gy,0%), rgba(255,255,255,.22), transparent 55%);opacity:0;transition:opacity .3s}
[data-tilt].active::after{opacity:1}

.hero{padding:30px;display:flex;flex-direction:column;gap:22px;min-height:440px;align-self:start}
.hero .layer{transform:translateZ(var(--z,0px))}
.date{color:var(--muted);font-weight:600;font-size:14px;letter-spacing:.08em;text-transform:uppercase}
.clock{font-size:clamp(64px,10vw,104px);font-weight:700;letter-spacing:-.05em;line-height:1;
  background:linear-gradient(180deg,#fff,rgba(255,255,255,.55));-webkit-background-clip:text;background-clip:text;color:transparent}
.clock small{font-size:.32em;letter-spacing:0;margin-left:6px;opacity:.7}
.greet{font-size:20px;font-weight:600}
.ringrow{display:flex;align-items:center;gap:22px}
.ring{width:132px;height:132px;position:relative;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);filter:drop-shadow(0 8px 16px rgba(48,209,88,.45))}
.ring .track{stroke:rgba(255,255,255,.14)}
.ring .bar{stroke:url(#g);transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-weight:700;font-size:28px;line-height:1}
.ring .num span{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-top:4px;letter-spacing:.06em}
.next{flex:1;padding:16px 18px;border-radius:20px;background:rgba(255,255,255,.1);border:1px solid var(--stroke);box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.next .lbl{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.next .ttl{font-size:19px;font-weight:700;margin-top:6px}
.next .when{color:var(--muted);font-size:14px;margin-top:4px}
.streak{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid var(--stroke);font-size:13px;font-weight:600}
.sync{font-size:12px;color:var(--muted);font-weight:600}

.listwrap{display:flex;flex-direction:column;gap:14px}
.listhead{display:flex;justify-content:space-between;align-items:center;padding:0 6px}
.listhead h2{margin:0;font-size:24px;letter-spacing:-.02em}
.seg{display:flex;background:rgba(255,255,255,.1);border:1px solid var(--stroke);border-radius:999px;padding:3px}
.seg button{font:inherit;font-size:13px;font-weight:600;color:var(--muted);background:none;border:0;padding:6px 12px;border-radius:999px;cursor:pointer}
.seg button.on{background:rgba(255,255,255,.25);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.item{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:22px;animation:pop .45s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes pop{from{opacity:0;margin-top:16px}to{opacity:1;margin-top:0}}
.item .ico{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:24px;flex:none;
  background:linear-gradient(145deg,var(--c,#0a84ff),rgba(255,255,255,.1));box-shadow:0 8px 18px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.6);transform:translateZ(24px)}
.item .meta{flex:1;min-width:0;transform:translateZ(14px)}
.item .t{font-weight:650;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{color:var(--muted);font-size:14px;margin-top:2px}
.item.done .t{text-decoration:line-through;opacity:.5}
.item.done .ico{filter:grayscale(.6) brightness(.8)}
.check{width:32px;height:32px;border-radius:50%;border:2px solid rgba(255,255,255,.5);background:none;cursor:pointer;display:grid;place-items:center;color:transparent;font-size:16px;flex:none;transition:all .25s;transform:translateZ(22px)}
.check:hover{border-color:#fff}
.item.done .check{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 0 20px rgba(48,209,88,.6)}
.del{background:none;border:0;color:var(--muted);cursor:pointer;font-size:18px;padding:6px;border-radius:8px;opacity:0;transition:.2s;transform:translateZ(12px)}
.item:hover .del{opacity:1}.del:hover{color:var(--red)}
@media(hover:none){.del{opacity:.7}}
.empty{padding:36px;text-align:center;color:var(--muted)}

.fab{position:fixed;right:28px;bottom:max(28px,env(safe-area-inset-bottom));z-index:20;width:64px;height:64px;border-radius:50%;font-size:32px;font-weight:300;
  display:grid;place-items:center;cursor:pointer;color:#fff;border:1px solid rgba(255,255,255,.5);
  background:radial-gradient(circle at 30% 25%,#7cc4ff,#0a84ff 60%,#5e5ce6);
  box-shadow:0 18px 40px rgba(10,132,255,.55), inset 0 2px 0 rgba(255,255,255,.6), inset 0 -8px 16px rgba(0,0,0,.25);
  transition:transform .25s cubic-bezier(.2,.9,.3,1.4)}
.fab:hover{transform:scale(1.1) rotate(90deg)}
.overlay{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s;perspective:1200px;padding:18px}
.overlay.open{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:420px;max-height:92vh;overflow:auto;padding:26px;transform:translateY(40px) rotateX(18deg) scale(.94);transition:transform .45s cubic-bezier(.2,.9,.3,1.1)}
.sheet.wide{max-width:640px}
.overlay.open .sheet{transform:none}
.sheet h3{margin:0 0 18px;font-size:22px;letter-spacing:-.02em}
.sheet p{color:var(--muted);line-height:1.45;margin:0 0 14px;font-size:15px}
.field{display:block;margin-bottom:16px}
.field>span{display:block;font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.field input{width:100%;font:inherit;font-size:17px;color:#fff;background:rgba(0,0,0,.22);border:1px solid var(--stroke);border-radius:14px;padding:13px 14px;outline:none;color-scheme:dark}
.field input:focus{border-color:#5ac8fa;box-shadow:0 0 0 3px rgba(90,200,250,.25)}
.emojis,.days{display:flex;gap:8px;flex-wrap:wrap}
.emojis button{width:44px;height:44px;border-radius:13px;font-size:22px;border:1px solid var(--stroke);background:rgba(255,255,255,.08);cursor:pointer;transition:.2s}
.emojis button.on{background:rgba(255,255,255,.3);transform:scale(1.12);box-shadow:0 6px 16px rgba(0,0,0,.3)}
.days button{width:40px;height:40px;border-radius:50%;font:inherit;font-weight:700;font-size:13px;color:#fff;border:1px solid var(--stroke);background:rgba(255,255,255,.08);cursor:pointer}
.days button.on{background:#0a84ff;border-color:#5ac8fa}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}
.err{color:#ff8a80;font-size:14px;min-height:20px;margin:-4px 0 10px}

/* auth screen */
#auth{position:relative;z-index:2;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px;perspective:1400px}
#auth .card{width:100%;max-width:400px;padding:32px 28px}
#auth .hero-ico{width:84px;height:84px;border-radius:22px;display:block;margin:0 auto 16px;box-shadow:0 18px 40px rgba(10,132,255,.5);transform:translateZ(50px)}
#auth h1{text-align:center;margin:0 0 6px;font-size:28px;letter-spacing:-.03em;transform:translateZ(30px)}
#auth .sub{text-align:center;color:var(--muted);margin:0 0 22px;transform:translateZ(20px)}
#auth .switch{text-align:center;margin-top:16px;color:var(--muted);font-size:14px}
#auth .switch a{color:#5ac8fa;cursor:pointer;font-weight:600;text-decoration:none}
#auth .btn.primary{width:100%;padding:14px;font-size:16px}
.ghost{background:none;border:0;color:var(--muted);font:inherit;font-size:14px;cursor:pointer;text-decoration:underline;display:block;margin:12px auto 0}

/* analytics */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
@media(max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{padding:14px;border-radius:18px;background:rgba(255,255,255,.1);border:1px solid var(--stroke)}
.stat b{display:block;font-size:26px;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px;padding:10px 4px 0;margin-bottom:6px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars i{display:block;width:100%;border-radius:8px 8px 4px 4px;background:linear-gradient(180deg,#5ac8fa,#0a84ff);min-height:3px;transition:height .6s}
.bars small{font-size:11px;color:var(--muted)}
.ftable{width:100%;border-collapse:collapse;font-size:14px}
.ftable td{padding:8px 4px;border-bottom:1px solid rgba(255,255,255,.1)}
.ftable td:last-child{text-align:right;font-weight:700}
.ftable .barcell{width:45%}
.ftable .barcell i{display:block;height:8px;border-radius:4px;background:linear-gradient(90deg,#bf5af2,#5e5ce6)}
h4{margin:18px 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}

/* Apple-like notification banners */
#banners{position:fixed;top:max(10px,env(safe-area-inset-top));left:0;right:0;z-index:100;display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none;perspective:900px}
.banner{pointer-events:auto;width:min(94vw,392px);border-radius:26px;padding:13px 15px;
  background:rgba(40,42,58,.55);backdrop-filter:blur(40px) saturate(200%);-webkit-backdrop-filter:blur(40px) saturate(200%);
  border:1px solid rgba(255,255,255,.22);box-shadow:0 18px 50px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.35);
  color:#fff;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;
  animation:drop .65s cubic-bezier(.2,1.2,.3,1) both;transform-origin:50% 0;
  transition:transform .35s cubic-bezier(.3,.9,.3,1), opacity .35s}
@keyframes drop{0%{transform:translateY(-130%) scale(.85) rotateX(-40deg);opacity:0}60%{opacity:1}100%{transform:none;opacity:1}}
.banner.out{transform:translateY(-140%) scale(.9)!important;opacity:0}
.banner .head{display:flex;gap:11px;align-items:flex-start}
.banner .app-ico{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:21px;flex:none;
  background:linear-gradient(145deg,#5ac8fa,#0a84ff 55%,#5e5ce6);box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.banner .txt{flex:1;min-width:0}
.banner .line1{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:rgba(255,255,255,.65);font-weight:600;letter-spacing:.02em;text-transform:uppercase}
.banner .ttl{font-weight:650;font-size:15.5px;margin-top:2px}
.banner .body{font-size:14.5px;color:rgba(255,255,255,.88);margin-top:1px;line-height:1.3}
.banner .grab{width:36px;height:5px;border-radius:3px;background:rgba(255,255,255,.4);margin:9px auto 0}
.banner .btns{display:none;gap:8px;margin-top:12px}
.banner.expanded .btns{display:flex}
.banner .btns button{flex:1;font:inherit;font-weight:600;font-size:14px;color:#fff;padding:10px;border-radius:14px;border:0;cursor:pointer;background:rgba(255,255,255,.18)}
.banner .btns button.ok{background:rgba(48,209,88,.85)}
.banner .btns button:active{transform:scale(.96)}

.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(30px);opacity:0;z-index:50;padding:11px 18px;border-radius:999px;font-weight:600;font-size:14px;transition:.4s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.steps{margin:0 0 14px;padding-left:20px;color:rgba(255,255,255,.88);line-height:1.6;font-size:15px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="scene" aria-hidden="true"></div>
<div id="banners" aria-live="polite"></div>

<!-- ============ LOGIN / SIGN-UP ============ -->
<section id="auth" hidden>
  <form class="glass card" id="authForm" data-tilt autocomplete="on" novalidate>
    <img class="hero-ico" src="/icons/glassy-daily-icon.png" type="image/png">
    <h1 id="authTitle">Welcome back</h1>
    <p class="sub" id="authSub">Sign in to sync your reminders on every device.</p>
    <label class="field" id="nameField" hidden><span>Name</span><input id="aName" autocomplete="name" maxlength="40" placeholder="Your name"></label>
    <label class="field"><span>Email</span><input id="aEmail" type="email" autocomplete="email" required placeholder="you@example.com"></label>
    <label class="field"><span>Password</span><input id="aPass" type="password" autocomplete="current-password" required minlength="6" placeholder="At least 6 characters"></label>
    <div class="err" id="authErr" role="alert"></div>
    <button class="btn primary" type="submit" id="authBtn">Sign in</button>
    <div class="switch" id="authSwitch">New here? <a id="toSignup">Create an account</a></div>
  </form>
</section>

<!-- ============ MAIN APP ============ -->
<main class="app" id="main" hidden>
  <header class="top">
    <div class="brand"><img class="logo" src="/icons/icon-192.png" alt="">Glassy Daily</div>
    <div class="actions">
      <button class="btn" id="btnPerm">🔔 Enable alerts</button>
      <button class="btn" id="btnTest">Test notification</button>
      <button class="btn" id="btnStats">📊 Usage</button>
      <button class="btn" id="btnInstall" hidden>⬇️ Install app</button>
      <button class="avatar" id="btnUser" title="Account">?</button>
    </div>
  </header>

  <section class="glass hero" data-tilt id="hero">
    <div class="date layer" style="--z:30px" id="date"></div>
    <div class="clock layer" style="--z:70px" id="clock">--:--</div>
    <div class="greet layer" style="--z:45px" id="greet"></div>
    <div class="ringrow layer" style="--z:55px">
      <div class="ring">
        <svg viewBox="0 0 120 120">
          <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7dffa1"/><stop offset="1" stop-color="#30d158"/></linearGradient></defs>
          <circle class="track" cx="60" cy="60" r="50" fill="none" stroke-width="12"/>
          <circle class="bar" id="bar" cx="60" cy="60" r="50" fill="none" stroke-width="12" stroke-linecap="round" stroke-dasharray="314.16" stroke-dashoffset="314.16"/>
        </svg>
        <div class="num"><div><b id="pct">0%</b><span id="frac">0 / 0</span></div></div>
      </div>
      <div class="next">
        <div class="lbl">Up next</div>
        <div class="ttl" id="nextTitle">—</div>
        <div class="when" id="nextWhen"></div>
      </div>
    </div>
    <div class="streak layer" style="--z:30px" id="chips"></div>
    <div class="sync layer" style="--z:20px" id="syncState">☁️ Synced</div>
  </section>

  <section class="listwrap">
    <div class="listhead">
      <h2>Today</h2>
      <div class="seg" id="seg">
        <button data-f="all" class="on">All</button><button data-f="todo">To do</button><button data-f="done">Done</button>
      </div>
    </div>
    <div id="list" class="listwrap" style="gap:12px"></div>
  </section>
</main>

<button class="fab" id="fab" aria-label="Add reminder" hidden>+</button>

<!-- new reminder -->
<div class="overlay" id="overlay">
  <form class="glass sheet" id="form" autocomplete="off">
    <h3>New reminder</h3>
    <label class="field"><span>What</span><input id="fTitle" placeholder="Drink a glass of water" maxlength="60" required></label>
    <label class="field"><span>Note (optional)</span><input id="fNote" placeholder="Stay hydrated" maxlength="90"></label>
    <label class="field"><span>Time</span><input id="fTime" type="time" required></label>
    <div class="field"><span>Repeat on</span><div class="days" id="days"></div></div>
    <div class="field"><span>Icon</span><div class="emojis" id="emojis"></div></div>
    <div class="row">
      <button type="button" class="btn" data-close>Cancel</button>
      <button class="btn primary" type="submit">Add</button>
    </div>
  </form>
</div>

<!-- alerts help -->
<div class="overlay" id="helpOverlay">
  <div class="glass sheet">
    <h3 id="helpTitle">Turn on notifications</h3>
    <p id="helpText"></p>
    <ol class="steps" id="helpSteps"></ol>
    <div class="row">
      <button class="btn" data-close>Close</button>
      <button class="btn primary" id="helpRetry">Try again</button>
    </div>
  </div>
</div>

<!-- analytics -->
<div class="overlay" id="statsOverlay">
  <div class="glass sheet wide">
    <h3>📊 Your usage</h3>
    <div class="seg" id="statsScope" style="display:inline-flex;margin-bottom:16px" hidden>
      <button data-s="me" class="on">Me</button><button data-s="all">All users</button>
    </div>
    <div id="statsBody"><p>Loading…</p></div>
    <div class="row"><button class="btn" data-close>Close</button></div>
  </div>
</div>

<!-- account -->
<div class="overlay" id="userOverlay">
  <div class="glass sheet">
    <h3 id="uName">Account</h3>
    <p id="uInfo"></p>
    <div class="row">
      <button class="btn" data-close>Close</button>
      <button class="btn warn" id="btnLogout">Sign out</button>
    </div>
  </div>
</div>

<div class="toast glass" id="toast"></div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const pad = n => String(n).padStart(2,'0');
  const todayKey = (d=new Date()) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const EMOJIS = ['💧','💊','🧘','🏃','📖','☕','🍎','😴','📞','✍️','🌿','💼'];
  const COLORS = ['#0a84ff','#bf5af2','#ff9f0a','#30d158','#ff375f','#64d2ff','#5e5ce6'];
  const DAYS = ['S','M','T','W','T','F','S'];
  const TZ = (Intl.DateTimeFormat().resolvedOptions().timeZone) || 'UTC';
  const CACHE_KEY = 'glassy-daily-v2-cache';
  const ua = navigator.userAgent;
  const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isStandalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  const inIframe = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();

  let user = null, reminders = [], filter = 'all';
  const localSnoozes = {};

  /* ---------------- API ---------------- */
  async function api(method, url, body) {
    const res = await fetch(url, { method, credentials: 'include', headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });
    let data = {}; try { data = await res.json(); } catch (e) {}
    if (!res.ok) { const err = new Error(data.error || `Request failed (${res.status})`); err.status = res.status; throw err; }
    return data;
  }

  /* ---------------- analytics (batched) ---------------- */
  let evQueue = [];
  function track(type, meta) { evQueue.push({ type, meta: meta || {}, ts: Date.now() }); if (evQueue.length >= 20) flush(); }
  async function flush() {
    if (!user || !evQueue.length) return;
    const batch = evQueue; evQueue = [];
    try { await api('POST', '/api/events', { events: batch }); } catch (e) { evQueue = batch.concat(evQueue).slice(-500); }
  }
  setInterval(flush, 15000);
  addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && user && evQueue.length) {
      const blob = new Blob([JSON.stringify({ events: evQueue })], { type: 'application/json' });
      if (navigator.sendBeacon && navigator.sendBeacon('/api/events', blob)) evQueue = []; else flush();
    }
    if (document.visibilityState === 'visible' && user) refresh();
  });

  /* ---------------- sync ---------------- */
  let syncTimer = null;
  function setSync(t) { $('#syncState').textContent = t; }
  function saveLocal() { try { localStorage.setItem(CACHE_KEY, JSON.stringify(reminders)); } catch (e) {} }
  function save() {
    saveLocal(); setSync('⏳ Saving…');
    clearTimeout(syncTimer);
    syncTimer = setTimeout(async () => {
      try { await api('PUT', '/api/reminders', { reminders }); setSync('☁️ Saved to your account'); }
      catch (e) { setSync(e.status === 401 ? '⚠️ Signed out' : '⚠️ Offline — will retry'); if (e.status === 401) return showAuth(); setTimeout(save, 10000); }
    }, 400);
  }
  async function refresh() {
    try { const d = await api('GET', '/api/reminders'); reminders = d.reminders; saveLocal(); render(); } catch (e) {}
  }

  /* ---------------- 3D background ---------------- */
  const scene = $('#scene');
  const spheres = [
    {s:230,x:6,y:58,c1:'#7aa8ff',c2:'#3a2cc9',z:-120,k:.6,d:13},
    {s:150,x:80,y:12,c1:'#ff9ad5',c2:'#b3166f',z:60,k:1.4,d:10},
    {s:100,x:70,y:70,c1:'#7dffe0',c2:'#08857a',z:140,k:2,d:9},
    {s:70,x:30,y:8,c1:'#ffd37a',c2:'#d46a00',z:200,k:2.6,d:8},
    {s:300,x:88,y:88,c1:'#b57aff',c2:'#481a9e',z:-260,k:.35,d:15}
  ].map(o => {
    const e = document.createElement('div'); e.className='sphere';
    e.style.cssText = `width:${o.s}px;height:${o.s}px;left:${o.x}%;top:${o.y}%;--c1:${o.c1};--c2:${o.c2};--d:${o.d}s`;
    scene.appendChild(e); return Object.assign({e}, o);
  });
  let mx=0,my=0,tx=0,ty=0;
  addEventListener('pointermove', e => { tx = e.clientX/innerWidth-.5; ty = e.clientY/innerHeight-.5; });
  addEventListener('deviceorientation', e => { if(e.gamma!=null){ tx=(e.gamma||0)/60; ty=((e.beta||0)-45)/90; } });
  (function loop(){
    mx += (tx-mx)*.06; my += (ty-my)*.06;
    spheres.forEach(o => { o.e.style.transform = `translate3d(${-mx*o.k*60}px,${-my*o.k*60}px,${o.z}px) rotateY(${mx*30}deg)`; });
    requestAnimationFrame(loop);
  })();

  /* ---------------- tilt ---------------- */
  let tiltEl=null;
  function resetTilt(el){ el.classList.remove('active'); el.style.setProperty('--rx','0deg'); el.style.setProperty('--ry','0deg'); }
  document.addEventListener('pointermove', e => {
    if (e.pointerType === 'touch') return;
    const el = e.target.closest ? e.target.closest('[data-tilt]') : null;
    if (tiltEl && tiltEl!==el) resetTilt(tiltEl);
    tiltEl = el; if(!el) return;
    const r = el.getBoundingClientRect();
    const px = (e.clientX-r.left)/r.width, py = (e.clientY-r.top)/r.height;
    const max = el.id==='hero' || el.id==='authForm' ? 8 : 6;
    el.classList.add('active');
    el.style.setProperty('--ry', ((px-.5)*2*max)+'deg');
    el.style.setProperty('--rx', ((.5-py)*2*max)+'deg');
    el.style.setProperty('--gx', (px*100)+'%'); el.style.setProperty('--gy', (py*100)+'%');
  });
  document.documentElement.addEventListener('pointerleave', () => { if (tiltEl) resetTilt(tiltEl); });

  /* ---------------- sound ---------------- */
  let actx;
  function chime(){
    try{
      actx = actx || new (window.AudioContext||window.webkitAudioContext)();
      if (actx.state==='suspended') actx.resume();
      [[880,0],[1318.5,.12],[1760,.26]].forEach(([f,t])=>{
        const o=actx.createOscillator(), g=actx.createGain();
        o.type='sine'; o.frequency.value=f; o.connect(g); g.connect(actx.destination);
        const s=actx.currentTime+t;
        g.gain.setValueAtTime(0,s); g.gain.linearRampToValueAtTime(.18,s+.02); g.gain.exponentialRampToValueAtTime(.001,s+.9);
        o.start(s); o.stop(s+1);
      });
    }catch(e){}
  }

  /* ---------------- helpers ---------------- */
  function fmt(t){ const [h,m]=t.split(':').map(Number); return `${((h+11)%12)+1}:${pad(m)} ${h<12?'AM':'PM'}`; }
  function minsOf(t){ const [h,m]=t.split(':').map(Number); return h*60+m; }
  let toastT;
  function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2800); }
  const isDone = r => r.doneDate===todayKey();
  const activeToday = r => !r.days || r.days.includes(new Date().getDay());
  function openSheet(id){ $(id).classList.add('open'); }
  function closeSheets(){ document.querySelectorAll('.overlay.open').forEach(o=>o.classList.remove('open')); }
  document.addEventListener('click', e => { if (e.target.closest('[data-close]')) closeSheets(); });
  document.querySelectorAll('.overlay').forEach(o => o.addEventListener('pointerdown', e => { if (e.target === o) closeSheets(); }));
  addEventListener('keydown', e => { if(e.key==='Escape') closeSheets(); });

  /* ---------------- Apple-like in-app banners ---------------- */
  const bannerHost = $('#banners');
  function banner(opts) {
    const reminder = opts.reminder || null;
    chime();
    try { if (navigator.vibrate) navigator.vibrate([20,40,20]); } catch(e){}
    const el = document.createElement('div'); el.className='banner'; el.setAttribute('role','alert');
    el.innerHTML = `
      <div class="head"><div class="app-ico"></div>
        <div class="txt"><div class="line1"><span class="app"></span><span>now</span></div><div class="ttl"></div><div class="body"></div></div>
      </div>
      <div class="btns">${reminder ? '<button class="snz">Snooze 10 min</button><button class="ok">Mark done</button>' : '<button class="cls">Dismiss</button>'}</div>
      <div class="grab"></div>`;
    el.querySelector('.app-ico').textContent = opts.emoji || '🔔';
    el.querySelector('.app').textContent = opts.app || 'Glassy Daily';
    el.querySelector('.ttl').textContent = opts.title;
    el.querySelector('.body').textContent = opts.body || '';
    bannerHost.prepend(el);
    track('banner_shown', { reminder: reminder && reminder.id });

    let timer = setTimeout(dismiss, 7000);
    function dismiss(){ clearTimeout(timer); el.classList.add('out'); setTimeout(()=>el.remove(),380); }
    let sy=0, dy=0, drag=false, moved=false;
    el.addEventListener('pointerdown', e => { if(e.target.closest('button')) return; drag=true; moved=false; sy=e.clientY; dy=0; el.setPointerCapture(e.pointerId); el.style.transition='none'; clearTimeout(timer); });
    el.addEventListener('pointermove', e => { if(!drag) return; dy=e.clientY-sy; if(Math.abs(dy)>4) moved=true; el.style.transform=`translateY(${dy<0?dy:dy*.15}px)`; });
    el.addEventListener('pointerup', () => { if(!drag) return; drag=false; el.style.transition=''; el.style.transform='';
      if (dy<-40) { track('banner_swipe'); dismiss(); return; }
      if (!moved) { el.classList.toggle('expanded'); track('banner_expand'); if(!el.classList.contains('expanded')) timer=setTimeout(dismiss,4000); }
      else timer=setTimeout(dismiss,4000);
    });
    el.addEventListener('mouseenter', () => clearTimeout(timer));
    el.addEventListener('mouseleave', () => { if(!el.classList.contains('expanded')) timer=setTimeout(dismiss,3500); });
    const snz = el.querySelector('.snz'), ok = el.querySelector('.ok'), cls = el.querySelector('.cls');
    if (snz) snz.onclick = () => { snooze(reminder); dismiss(); };
    if (ok) ok.onclick = () => { markDone(reminder); dismiss(); };
    if (cls) cls.onclick = dismiss;
    while (bannerHost.children.length > 4) bannerHost.lastChild.remove();
  }
  async function markDone(r) {
    const real = reminders.find(x => x.id === r.id);
    if (!real) return;
    real.doneDate = todayKey(); saveLocal(); render(); toast('Marked done ✓');
    try { await api('POST', `/api/reminders/${encodeURIComponent(r.id)}/done`, { source: 'banner' }); } catch (e) { save(); }
  }
  async function snooze(r) {
    if (!reminders.find(x => x.id === r.id)) return;
    localSnoozes[r.id] = Date.now() + 10*60*1000;
    toast('Snoozed for 10 minutes');
    try { await api('POST', `/api/reminders/${encodeURIComponent(r.id)}/snooze`, { minutes: 10, source: 'banner' }); } catch (e) {}
  }

  /* ---------------- render ---------------- */
  function render(){
    const sorted = [...reminders].sort((a,b)=>minsOf(a.time)-minsOf(b.time));
    const list = $('#list'); list.innerHTML='';
    const shown = sorted.filter(r => filter==='all' || (filter==='done'?isDone(r):!isDone(r)));
    if (!shown.length) list.innerHTML = `<div class="glass empty">${reminders.length?'Nothing here — nice.':'No reminders yet. Tap + to add one.'}</div>`;
    shown.forEach((r,i) => {
      const d = document.createElement('div');
      d.className = 'glass item' + (isDone(r)?' done':''); d.setAttribute('data-tilt',''); d.style.animationDelay = (i*60)+'ms';
      d.style.setProperty('--c', r.color);
      d.innerHTML = `<div class="ico"></div><div class="meta"><div class="t"></div><div class="s"></div></div>
        <button class="del" title="Delete" aria-label="Delete reminder">✕</button><button class="check" aria-label="Toggle done">✓</button>`;
      d.querySelector('.ico').textContent = r.emoji;
      d.querySelector('.t').textContent = r.title;
      const rep = !r.days || r.days.length === 7 ? 'every day' : r.days.length === 5 && !r.days.includes(0) && !r.days.includes(6) ? 'weekdays' : r.days.map(x => ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][x]).join(', ');
      d.querySelector('.s').textContent = `${fmt(r.time)} · ${rep}`;
      d.querySelector('.check').onclick = () => {
        const was = isDone(r); r.doneDate = was ? null : todayKey();
        track(was ? 'reminder_undone' : 'reminder_done', { reminder: r.id }); save(); render();
      };
      d.querySelector('.del').onclick = () => { reminders = reminders.filter(x=>x!==r); track('reminder_delete'); save(); render(); toast('Reminder deleted'); };
      list.appendChild(d);
    });
    const today = reminders.filter(activeToday);
    const total = today.length, done = today.filter(isDone).length;
    const pct = total ? Math.round(done/total*100) : 0;
    $('#bar').style.strokeDashoffset = 314.16*(1-(total?done/total:0));
    $('#pct').textContent = pct+'%'; $('#frac').textContent = `${done} / ${total} DONE`;
    const now = new Date(), nm = now.getHours()*60+now.getMinutes();
    const upcoming = sorted.filter(r => !isDone(r) && activeToday(r));
    const nxt = upcoming.find(r => minsOf(r.time)>=nm) || null;
    if (nxt) {
      const diff = minsOf(nxt.time)-nm;
      $('#nextTitle').textContent = `${nxt.emoji} ${nxt.title}`;
      $('#nextWhen').textContent = `${fmt(nxt.time)} · ${diff===0?'now':diff<60?`in ${diff} min`:`in ${Math.floor(diff/60)}h ${diff%60}m`}`;
    } else {
      const allDone = total && done===total;
      $('#nextTitle').textContent = allDone ? '🎉 All done' : (upcoming.length ? `⏰ ${upcoming[0].title}` : 'Nothing scheduled');
      $('#nextWhen').textContent = allDone ? 'Enjoy your day' : (upcoming.length ? 'Missed earlier — tap ✓ when finished' : 'Add a reminder with +');
    }
    $('#chips').innerHTML = `<span class="chip">🔔 ${total} today</span><span class="chip">✅ ${done} completed</span><span class="chip">⏳ ${total-done} left</span>`;
  }

  /* ---------------- clock + in-app firing (when the app is open) ---------------- */
  let lastRenderMin = -1;
  const firedLocal = {};
  function tick(){
    const now = new Date(), h = now.getHours();
    $('#clock').innerHTML = `${((h+11)%12)+1}:${pad(now.getMinutes())}<small>${h<12?'AM':'PM'}</small>`;
    $('#date').textContent = now.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
    $('#greet').textContent = (h<5?'Still up':h<12?'Good morning':h<18?'Good afternoon':'Good evening') + (user ? `, ${user.name}` : '') + (h<5?' 🌙':h<12?' ☀️':h<18?' 🌤':' 🌆');
    if (!user) return;
    const cur = pad(h)+':'+pad(now.getMinutes()), key = todayKey(now);
    reminders.forEach(r => {
      const k = r.id + key;
      // if this device has push, the service worker shows the system notification; show only the in-app banner while visible
      if (r.time===cur && !firedLocal[k] && !isDone(r) && activeToday(r)) {
        firedLocal[k] = 1;
        if (document.visibilityState === 'visible') banner({ title: r.title, body: r.note || `It's ${fmt(r.time)}`, emoji: r.emoji, reminder: r });
      }
      if (localSnoozes[r.id] && Date.now() >= localSnoozes[r.id]) {
        delete localSnoozes[r.id];
        if (!isDone(r) && document.visibilityState === 'visible') banner({ title: r.title, body: r.note || 'Snoozed reminder', emoji: r.emoji, reminder: r });
      }
    });
    const minKey = h*60+now.getMinutes();
    if (minKey!==lastRenderMin) { lastRenderMin=minKey; render(); }
  }

  /* ---------------- service worker + real push ---------------- */
  let swReg = null;
  async function registerSW() {
    if (!('serviceWorker' in navigator) || !window.isSecureContext) return null;
    try {
      swReg = await navigator.serviceWorker.register('/sw.js', { scope: '/' });
      navigator.serviceWorker.addEventListener('message', e => {
        if (e.data && e.data.type === 'refresh') refresh();
      });
      return swReg;
    } catch (e) { console.warn('SW failed', e); return null; }
  }
  function urlB64ToUint8Array(b64) {
    const padding = '='.repeat((4 - b64.length % 4) % 4);
    const raw = atob((b64 + padding).replace(/-/g, '+').replace(/_/g, '/'));
    return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
  }

  // Works out WHY alerts can't be turned on, and tells the user how to fix it.
  function alertBlocker() {
    if (inIframe) return { title: 'Open the app in its own tab', text: 'Notifications are blocked while the app is shown inside another page or preview.', steps: ['Open the app link directly in Chrome or Safari (not inside a preview).', 'Tap 🔔 Enable alerts again.'] };
    if (!window.isSecureContext) return { title: 'A secure (https) link is needed', text: 'Phones only allow notifications from websites opened with https://. A file opened from your phone or a plain http:// address cannot ask for permission.', steps: ['Open the app from its https:// web address (see the setup guide).', 'Tap 🔔 Enable alerts again.'] };
    if (isIOS && !isStandalone) return { title: 'Add it to your Home Screen first', text: 'On iPhone and iPad, Apple only allows notifications for web apps installed on the Home Screen (iOS 16.4 or newer).', steps: ['Tap the Share button (square with an arrow) in Safari.', 'Choose “Add to Home Screen”, then tap Add.', 'Open Glassy Daily from your Home Screen.', 'Tap 🔔 Enable alerts and choose Allow.'] };
    if (!('Notification' in window) || !('serviceWorker' in navigator) || !('PushManager' in window)) return { title: 'This browser cannot show push alerts', text: 'Try the latest Chrome (Android, Windows, Mac) or Safari (iPhone with the app added to Home Screen).', steps: [] };
    if (Notification.permission === 'denied') {
      const steps = isIOS
        ? ['Open the iPhone Settings app → Notifications.', 'Find “Glassy Daily” and turn on Allow Notifications.', 'Come back and tap Try again.']
        : /Android/.test(ua)
          ? ['Tap the icon left of the address bar (or ⋮ → Settings → Site settings).', 'Tap Notifications → Allow.', 'Also check phone Settings → Apps → Chrome → Notifications is on.', 'Come back and tap Try again.']
          : ['Click the icon left of the address bar (🔒 or ⓘ).', 'Set Notifications to Allow, then reload the page.', 'On Mac also check System Settings → Notifications → your browser.'];
      return { title: 'Notifications are blocked', text: 'You (or the browser) chose “Block” earlier, so the browser will not ask again. You can switch it back on in a few taps:', steps };
    }
    return null;
  }
  function showHelp(b) {
    $('#helpTitle').textContent = b.title; $('#helpText').textContent = b.text;
    $('#helpSteps').innerHTML = ''; b.steps.forEach(s => { const li = document.createElement('li'); li.textContent = s; $('#helpSteps').appendChild(li); });
    $('#helpSteps').hidden = !b.steps.length;
    openSheet('#helpOverlay');
  }
  async function enableAlerts() {
    track('enable_alerts_click', { permission: 'Notification' in window ? Notification.permission : 'unsupported' });
    const blocker = alertBlocker();
    if (blocker) { track('enable_alerts_blocked', { reason: blocker.title }); return showHelp(blocker); }
    const btn = $('#btnPerm'); btn.disabled = true; btn.textContent = '⏳ Asking…';
    try {
      // must be called directly from the tap so phones show the permission prompt
      const perm = Notification.permission === 'granted' ? 'granted' : await Notification.requestPermission();
      if (perm !== 'granted') {
        track('enable_alerts_denied', { perm });
        const b = alertBlocker();
        showHelp(b || { title: 'Permission not given', text: 'The prompt was closed without choosing Allow. Tap Try again and choose Allow.', steps: [] });
        return;
      }
      const reg = swReg || await registerSW() || await navigator.serviceWorker.ready;
      const { publicKey } = await api('GET', '/api/push/key');
      let sub = await reg.pushManager.getSubscription();
      if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlB64ToUint8Array(publicKey) });
      const r = await api('POST', '/api/push/subscribe', { subscription: sub.toJSON(), tz: TZ });
      track('enable_alerts_success', { devices: r.devices });
      toast('🔔 Alerts on — reminders will reach this phone even when the app is closed');
    } catch (e) {
      console.error(e);
      track('enable_alerts_error', { message: String(e.message || e).slice(0, 120) });
      showHelp({ title: 'Couldn’t finish turning on alerts', text: `Something went wrong: ${e.message || e}. Check your internet connection and try again.`, steps: [] });
    } finally { btn.disabled = false; updatePermButton(); }
  }
  async function updatePermButton() {
    const btn = $('#btnPerm');
    btn.classList.remove('on','warn');
    if (!('Notification' in window) || alertBlocker()) { btn.textContent = '🔔 Enable alerts'; btn.classList.add('warn'); return; }
    let subscribed = false;
    try { const reg = swReg || (await navigator.serviceWorker.getRegistration()); subscribed = !!(reg && await reg.pushManager.getSubscription()); } catch (e) {}
    if (Notification.permission === 'granted' && subscribed) { btn.textContent = '🔔 Alerts on'; btn.classList.add('on'); }
    else btn.textContent = '🔔 Enable alerts';
  }
  $('#btnPerm').onclick = enableAlerts;
  $('#helpRetry').onclick = () => { closeSheets(); enableAlerts(); };
  $('#btnTest').onclick = async () => {
    track('test_notification');
    banner({ title: 'Time to hydrate', body: 'This is the in-app banner. Tap to expand, swipe up to dismiss.', emoji: '💧' });
    if ('Notification' in window && Notification.permission === 'granted') {
      try { const r = await api('POST', '/api/push/test'); toast(`Real push sent to ${r.sent} device${r.sent===1?'':'s'}`); }
      catch (e) { toast(e.message); }
    }
  };

  /* install prompt (Android / desktop Chrome) */
  let deferredPrompt = null;
  addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; $('#btnInstall').hidden = false; });
  $('#btnInstall').onclick = async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice; track('install_prompt', { outcome });
    deferredPrompt = null; $('#btnInstall').hidden = true;
  };
  addEventListener('appinstalled', () => track('app_installed'));

  /* ---------------- analytics view ---------------- */
  const FEATURE_NAMES = {
    app_open:'Opened the app', login:'Signed in', signup:'Created account', logout:'Signed out',
    reminder_add:'Added a reminder', reminder_done:'Completed a reminder', reminder_undone:'Un-ticked a reminder', reminder_delete:'Deleted a reminder',
    reminder_snooze:'Snoozed (in app)', push_done:'Completed from notification', push_snooze:'Snoozed from notification', push_sent:'Phone notifications sent',
    push_subscribed:'Turned on phone alerts', push_test:'Sent test push', banner_shown:'In-app banners shown', banner_expand:'Expanded a banner', banner_swipe:'Swiped a banner away',
    filter_change:'Changed the filter', test_notification:'Pressed Test notification', enable_alerts_click:'Pressed Enable alerts', enable_alerts_success:'Alerts turned on OK',
    enable_alerts_blocked:'Alerts blocked (needs a fix)', enable_alerts_denied:'Alerts permission refused', enable_alerts_error:'Alerts setup error',
    stats_open:'Opened Usage', install_prompt:'Saw install prompt', app_installed:'Installed the app'
  };
  let statsScope = 'me';
  async function loadStats() {
    const body = $('#statsBody'); body.innerHTML = '<p>Loading…</p>';
    await flush();
    try {
      const s = await api('GET', statsScope === 'all' ? '/api/admin/analytics' : '/api/analytics');
      const max7 = Math.max(1, ...s.last7.map(d => d.events));
      const maxF = Math.max(1, ...s.features.map(f => f.count));
      const done = s.features.filter(f => /done$/.test(f.feature) && f.feature !== 'reminder_undone').reduce((n, f) => n + f.count, 0);
      const pushes = (s.features.find(f => f.feature === 'push_sent') || {}).count || 0;
      body.innerHTML = `
        <div class="stats">
          <div class="stat"><b>${statsScope==='all'?s.users:s.reminders}</b><span>${statsScope==='all'?'Users':'Reminders'}</span></div>
          <div class="stat"><b>${done}</b><span>Completed</span></div>
          <div class="stat"><b>${pushes}</b><span>Push sent</span></div>
          <div class="stat"><b>${s.totalEvents}</b><span>Actions</span></div>
        </div>
        <h4>Activity — last 7 days</h4>
        <div class="bars">${s.last7.map(d => `<div><i style="height:${Math.round(d.events/max7*100)}%" title="${d.events} actions"></i><small>${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date(d.day+'T12:00:00Z').getUTCDay()]}</small></div>`).join('')}</div>
        <h4>How each feature is used</h4>
        <table class="ftable"><tbody>${s.features.map(f => `<tr><td></td><td class="barcell"><i style="width:${Math.max(4, Math.round(f.count/maxF*100))}%"></i></td><td>${f.count}</td></tr>`).join('') || '<tr><td>No activity yet</td></tr>'}</tbody></table>
        ${s.perUser ? `<h4>Users</h4><table class="ftable"><tbody>${s.perUser.map(() => '<tr><td></td><td></td><td></td></tr>').join('')}</tbody></table>` : ''}`;
      // fill text safely
      const rows = body.querySelectorAll('.ftable')[0].querySelectorAll('tr');
      s.features.forEach((f, i) => { rows[i].firstElementChild.textContent = FEATURE_NAMES[f.feature] || f.feature.replace(/_/g, ' '); });
      if (s.perUser) {
        const urows = body.querySelectorAll('.ftable')[1].querySelectorAll('tr');
        s.perUser.forEach((u, i) => {
          const c = urows[i].children;
          c[0].textContent = `${u.name} (${u.email})`;
          c[1].textContent = `${u.reminders} reminders · ${u.devices} phone${u.devices===1?'':'s'}`;
          c[2].textContent = `${u.events} actions`;
        });
      }
    } catch (e) { body.innerHTML = ''; const p = document.createElement('p'); p.textContent = e.message; body.appendChild(p); }
  }
  $('#btnStats').onclick = () => { track('stats_open'); openSheet('#statsOverlay'); loadStats(); };
  $('#statsScope').onclick = e => { const b = e.target.closest('button'); if (!b) return; statsScope = b.dataset.s; [...$('#statsScope').children].forEach(x => x.classList.toggle('on', x === b)); loadStats(); };

  /* ---------------- account ---------------- */
  $('#btnUser').onclick = async () => {
    let devices = 0; try { devices = (await api('GET', '/api/me')).pushDevices; } catch (e) {}
    $('#uName').textContent = user.name;
    $('#uInfo').textContent = `${user.email} · time zone ${user.tz} · alerts on ${devices} device${devices===1?'':'s'}. Your reminders are saved to your account and sync across devices.`;
    openSheet('#userOverlay');
  };
  $('#btnLogout').onclick = async () => {
    await flush();
    try { const reg = swReg || await navigator.serviceWorker.getRegistration(); const sub = reg && await reg.pushManager.getSubscription();
      if (sub) { await api('POST', '/api/push/unsubscribe', { endpoint: sub.endpoint }); await sub.unsubscribe(); } } catch (e) {}
    try { await api('POST', '/api/logout'); } catch (e) {}
    user = null; reminders = []; localStorage.removeItem(CACHE_KEY); closeSheets(); showAuth();
  };

  /* ---------------- auth ---------------- */
  let mode = 'login';
  function setMode(m) {
    mode = m; const s = m === 'signup';
    $('#authTitle').textContent = s ? 'Create your account' : 'Welcome back';
    $('#authSub').textContent = s ? 'Your reminders are saved to your account and sync to every device.' : 'Sign in to sync your reminders on every device.';
    $('#nameField').hidden = !s; $('#authBtn').textContent = s ? 'Create account' : 'Sign in';
    $('#aPass').autocomplete = s ? 'new-password' : 'current-password';
    $('#authSwitch').innerHTML = s ? 'Already have an account? <a id="toLogin">Sign in</a>' : 'New here? <a id="toSignup">Create an account</a>';
    $('#authErr').textContent = '';
  }
  $('#authSwitch').onclick = e => { if (e.target.id === 'toSignup') setMode('signup'); if (e.target.id === 'toLogin') setMode('login'); };
  $('#authForm').onsubmit = async e => {
    e.preventDefault();
    const email = $('#aEmail').value.trim(), password = $('#aPass').value;
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return $('#authErr').textContent = 'Enter a valid email address';
    if (password.length < 6) return $('#authErr').textContent = 'Password must be at least 6 characters';
    $('#authBtn').disabled = true; $('#authErr').textContent = '';
    try {
      const body = { email, password, tz: TZ };
      if (mode === 'signup') { body.name = $('#aName').value.trim(); body.reminders = starterReminders(); }
      const d = await api('POST', mode === 'signup' ? '/api/signup' : '/api/login', body);
      $('#aPass').value = '';
      start(d.user, d.reminders);
    } catch (err) { $('#authErr').textContent = err.message; }
    finally { $('#authBtn').disabled = false; }
  };
  function starterReminders() {
    // carry over reminders from the old offline version, otherwise a friendly starter set
    let old = null; try { old = JSON.parse(localStorage.getItem('glassy-daily-v1')); } catch (e) {}
    if (Array.isArray(old) && old.length) return old.map(r => Object.assign({}, r, { id: String(r.id) }));
    return [
      {id:'s1',title:'Take vitamins',note:'With breakfast',time:'08:00',emoji:'💊',color:COLORS[2]},
      {id:'s2',title:'Drink water',note:'Stay hydrated',time:'10:30',emoji:'💧',color:COLORS[0]},
      {id:'s3',title:'Stretch break',note:'Stand up and move for 5 minutes',time:'13:00',emoji:'🧘',color:COLORS[1]},
      {id:'s4',title:'Evening walk',note:'Get some fresh air',time:'18:30',emoji:'🏃',color:COLORS[3]},
      {id:'s5',title:'Journal',note:'Three things you are grateful for',time:'21:30',emoji:'✍️',color:COLORS[4]}
    ];
  }
  function showAuth() {
    $('#main').hidden = true; $('#fab').hidden = true; $('#auth').hidden = false; setMode(mode);
  }
  function start(u, list) {
    user = u; reminders = list || [];
    saveLocal();
    $('#auth').hidden = true; $('#main').hidden = false; $('#fab').hidden = false;
    $('#btnUser').textContent = (u.name || u.email)[0].toUpperCase();
    $('#statsScope').hidden = !u.admin;
    if (u.tz !== TZ) api('PATCH', '/api/me', { tz: TZ }).catch(() => {});
    track('app_open', { standalone: isStandalone, ios: isIOS });
    lastRenderMin = -1; tick(); updatePermButton();
    setTimeout(() => banner({ title: `Hi ${u.name} 👋`, body: Notification && 'Notification' in window && Notification.permission === 'granted' ? 'Your reminders are synced and alerts are on.' : 'Tap 🔔 Enable alerts to get reminders on this phone even when the app is closed.', emoji: '🔔' }), 700);
  }

  /* ---------------- new reminder sheet ---------------- */
  let selEmoji = EMOJIS[0], selDays = [0,1,2,3,4,5,6];
  $('#emojis').innerHTML = EMOJIS.map((e,i)=>`<button type="button" data-e="${e}" class="${i?'':'on'}">${e}</button>`).join('');
  $('#emojis').onclick = e => { const b=e.target.closest('button'); if(!b) return; selEmoji=b.dataset.e; [...$('#emojis').children].forEach(x=>x.classList.toggle('on',x===b)); };
  $('#days').innerHTML = DAYS.map((d,i)=>`<button type="button" data-d="${i}" class="on" aria-label="${['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][i]}">${d}</button>`).join('');
  $('#days').onclick = e => { const b=e.target.closest('button'); if(!b) return; b.classList.toggle('on'); selDays=[...$('#days').children].filter(x=>x.classList.contains('on')).map(x=>Number(x.dataset.d)); };
  $('#fab').onclick = () => { const n=new Date(Date.now()+60000); $('#fTime').value = pad(n.getHours())+':'+pad(n.getMinutes()); openSheet('#overlay'); setTimeout(()=>$('#fTitle').focus(),300); };
  $('#form').onsubmit = e => {
    e.preventDefault();
    if (!selDays.length) return toast('Pick at least one day');
    const r = { id: 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2,6), title:$('#fTitle').value.trim(), note:$('#fNote').value.trim(), time:$('#fTime').value,
      emoji:selEmoji, color:COLORS[Math.floor(Math.random()*COLORS.length)], days: selDays.length === 7 ? null : selDays.slice(), createdAt: Date.now() };
    reminders.push(r); track('reminder_add', { emoji: r.emoji, days: selDays.length });
    save(); render(); closeSheets(); $('#form').reset();
    [...$('#days').children].forEach(x=>x.classList.add('on')); selDays=[0,1,2,3,4,5,6];
    toast(Notification && 'Notification' in window && Notification.permission === 'granted' ? 'Reminder added — it will notify this phone' : 'Reminder added — tap 🔔 Enable alerts to get it on your phone');
  };
  $('#seg').onclick = e => { const b=e.target.closest('button'); if(!b) return; filter=b.dataset.f; [...$('#seg').children].forEach(x=>x.classList.toggle('on',x===b)); track('filter_change', { filter }); render(); };

  /* ---------------- boot ---------------- */
  (async function boot() {
    registerSW().then(updatePermButton);
    setInterval(tick, 1000);
    try {
      const d = await api('GET', '/api/me');
      start(d.user, d.reminders);
    } catch (e) {
      if (e.status === 401) showAuth();
      else {
        // offline: show cached reminders read-only until the server is reachable
        let cached = []; try { cached = JSON.parse(localStorage.getItem(CACHE_KEY)) || []; } catch (x) {}
        if (cached.length) { user = { name: 'offline', email: '', tz: TZ }; reminders = cached; $('#main').hidden = false; $('#fab').hidden = false; tick(); setSync('⚠️ Offline — showing saved copy'); }
        else showAuth();
      }
    }
  })();
})();
</script>
</body>
</html>
